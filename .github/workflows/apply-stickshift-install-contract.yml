name: Apply StickShift install contract

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair staged patch runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_stickshift_install_contract.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if text.count(old) != 1:
              raise SystemExit('sub_once implementation anchor not found exactly once')
          text = text.replace(old, new, 1)
          triple = "    '''def escape_style_data_block(content):"
          if text.count(triple) != 2:
              raise SystemExit('escape-style triple-string anchors not found exactly twice')
          text = text.replace(triple, "    r'''def escape_style_data_block(content):", 2)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .patch-error.txt .test-error.txt

      - name: Apply contract patch
        shell: bash
        run: |
          set +e
          python3 tools/apply_stickshift_install_contract.py 2>&1 | tee .patch-error.txt
          status=${PIPESTATUS[0]}
          set -e
          exit $status

      - name: Apply round-trip corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src_path = Path('local-ide.src.html')
          src = src_path.read_text(encoding='utf-8')
          anchor = '    function unpackInlinedLibraries(html) {'
          helper = '''    function skillFrontmatterValue(markdown,key) {
              const escaped=String(key||'').replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');
              const match=String(markdown||'').match(new RegExp('^'+escaped+'\\\\s*:\\\\s*(.+)$','m'));
              if(!match)return '';
              const raw=match[1].trim();
              if(raw.startsWith('"')&&raw.endsWith('"')){try{return JSON.parse(raw);}catch(error){return raw.slice(1,-1);}}
              if(raw.startsWith("'")&&raw.endsWith("'"))return raw.slice(1,-1).replace(/''/g,"'");
              return raw;
            }
'''
          if src.count(anchor) != 1:
              raise SystemExit('unpack helper anchor not found exactly once')
          src = src.replace(anchor, helper + anchor, 1)
          old_description = "description:(markdown.match(/^description:\\s*(.+)$/m)||[])[1]||'Imported tool.'"
          new_description = "description:skillFrontmatterValue(markdown,'description')||'Imported tool.'"
          if src.count(old_description) != 1:
              raise SystemExit('imported description anchor not found exactly once')
          src = src.replace(old_description, new_description, 1)
          src_path.write_text(src, encoding='utf-8')

          test_path = Path('test_export.cjs')
          test = test_path.read_text(encoding='utf-8')
          old_test = "check('built Local HTML IDE carries exactly one install skill block', (built.match(/id=\"stickshift-skill\"/g)||[]).length===1&&!built.includes('id=\"ide-coding-skill\"'));"
          new_test = "check('built Local HTML IDE carries exactly one install skill block', (built.match(/id=\"stickshift-skill\" data-skill-slug=\"local-html-ide\"/g)||[]).length===1&&!built.includes('id=\"ide-coding-skill\"'));"
          if test.count(old_test) != 1:
              raise SystemExit('install skill count assertion not found exactly once')
          test_path.write_text(test.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Rebuild standalone artifacts
        run: python3 build_local_ide.py

      - name: Run contract and regression tests
        shell: bash
        run: |
          set +e
          {
            node tests/patch-engine.test.cjs &&
            node test_export.cjs &&
            node tests/export-integrity.test.cjs &&
            node tests/stickshift-package-contract.test.cjs &&
            node tests/local-html-ide-skill.test.cjs &&
            node tests/script-breakout-scanner.test.cjs &&
            python3 tests/html-shell-integrity.test.py &&
            npm run lint &&
            cmp -s local-ide.html public/local-ide.html &&
            git diff --check
          } 2>&1 | tee .test-error.txt
          status=${PIPESTATUS[0]}
          set -e
          exit $status

      - name: Commit implementation
        run: |
          rm tools/apply_stickshift_install_contract.py
          rm .github/workflows/apply-stickshift-install-contract.yml
          rm -f .patch-error.txt .test-error.txt .contract-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: align HTML IDE exports with StickShift installer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Persist diagnostics
        if: failure()
        run: |
          if [ -f .patch-error.txt ] || [ -f .test-error.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .patch-error.txt .test-error.txt 2>/dev/null || true
            git commit -m "chore: capture StickShift contract diagnostics" || true
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

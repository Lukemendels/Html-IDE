name: Harden StickShift package

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/stickshift-install-contract'
    runs-on: ubuntu-latest
    steps:
      - name: Check out HTML IDE feature
        uses: actions/checkout@v4
        with:
          ref: feature/stickshift-install-contract
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harden namespaced XML in script data blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build_path = Path('build_local_ide.py')
          build = build_path.read_text(encoding='utf-8')
          start = build.index('def escape_script_data_block(content):')
          end = build.index('\ndef escape_style_data_block(content):', start)
          replacement = r'''def escape_script_data_block(content):
              """Keep JavaScript library text inert inside HTML script data blocks."""
              content = re.sub(r"</script", r"<\/script", content, flags=re.IGNORECASE)
              # Some document libraries contain literal namespaced XML such as
              # <style:master-page> inside JavaScript strings. Encode the angle
              # bracket as a JavaScript escape so host HTML scanners do not
              # mistake library data for live markup; runtime strings are unchanged.
              return re.sub(r"<(?=/?style:)", lambda _match: r"\x3C", content, flags=re.IGNORECASE)
          '''.replace('          ', '').rstrip()
          build_path.write_text(build[:start] + replacement + build[end:], encoding='utf-8')

          test_path = Path('tests/export-integrity.test.cjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = "assert(!built.includes('id=\"ide-coding-skill\"'), 'obsolete duplicate IDE skill block is absent');\n"
          addition = anchor + "assert(!/<\\/?style:/i.test(built), 'standalone package exposes no raw namespaced style tags to host HTML scanners');\nassert(/\\\\x3Cstyle:/i.test(built), 'namespaced style markup is preserved through JavaScript hex escapes');\n"
          if test.count(anchor) != 1:
              raise SystemExit(f'export integrity anchor expected once, found {test.count(anchor)}')
          test_path.write_text(test.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Rebuild standalone artifacts
        run: python3 build_local_ide.py

      - name: Run HTML IDE regression suite
        run: |
          node tests/patch-engine.test.cjs
          node test_export.cjs
          node tests/export-integrity.test.cjs
          node tests/stickshift-package-contract.test.cjs
          node tests/local-html-ide-skill.test.cjs
          node tests/script-breakout-scanner.test.cjs
          python3 tests/html-shell-integrity.test.py
          npm run lint
          cmp -s local-ide.html public/local-ide.html
          git diff --check

      - name: Clone public StickShift validator
        run: git clone --depth 1 --branch feature/html-ide-install-contract https://github.com/Lukemendels/StickShift.git stickshift-host

      - name: Validate actual IDE package through StickShift
        working-directory: stickshift-host
        run: node tests/validate-html-tool-file.mjs ../local-ide.html

      - name: Commit validated package hardening
        run: |
          rm .github/workflows/harden-stickshift-package.yml
          rm -rf stickshift-host
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden StickShift package library payloads"
          git push origin HEAD:feature/stickshift-install-contract
